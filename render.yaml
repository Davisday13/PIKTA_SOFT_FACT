services:
  - type: web
    name: pikta-pos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements_render.txt
    startCommand: gunicorn api_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PIKTA_JWT_SECRET
        generateValue: true
      - key: PIKTA_PEPPER
        generateValue: true
      - key: PIKTA_SQL_TOKEN
        generateValue: true
